<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.07)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Overlay -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <path d="M0 75 H1200 M0 150 H1200 M0 225 H1200 M0 300 H1200 M0 375 H1200 M0 450 H1200 M0 525 H1200 M0 600 H1200"/>
    <path d="M150 0 V675 M300 0 V675 M450 0 V675 M600 0 V675 M750 0 V675 M900 0 V675 M1050 0 V675"/>
  </g>

  <!-- Glowing background blur circle -->
  <circle cx="300" cy="200" r="250" fill="#4f46e5" opacity="0.15" filter="blur(60px)"/>
  <circle cx="900" cy="450" r="220" fill="#9333ea" opacity="0.15" filter="blur(60px)"/>

  <!-- App Frame Header -->
  <rect x="60" y="50" width="1080" height="575" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  <rect x="60" y="50" width="1080" height="48" rx="16" fill="rgba(30, 41, 59, 0.9)"/>
  <circle cx="90" cy="74" r="6" fill="#ef4444"/>
  <circle cx="110" cy="74" r="6" fill="#eab308"/>
  <circle cx="130" cy="74" r="6" fill="#22c55e"/>
  <rect x="170" y="62" width="400" height="24" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="185" y="78" fill="#94a3b8" font-family="sans-serif" font-size="12">bumiwirarajagroup.com/admin/dashboard</text>

  <!-- Sidebar Wireframe -->
  <rect x="80" y="118" width="200" height="487" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.05)"/>
  <rect x="100" y="140" width="160" height="28" rx="6" fill="url(#accentGrad)"/>
  <text x="115" y="158" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="12">📊 Executive Hub</text>
  <rect x="100" y="180" width="160" height="20" rx="4" fill="rgba(255,255,255,0.05)"/>
  <rect x="100" y="210" width="160" height="20" rx="4" fill="rgba(255,255,255,0.05)"/>
  <rect x="100" y="240" width="160" height="20" rx="4" fill="rgba(255,255,255,0.05)"/>
  <rect x="100" y="270" width="160" height="20" rx="4" fill="rgba(255,255,255,0.05)"/>
  <rect x="100" y="300" width="160" height="20" rx="4" fill="rgba(255,255,255,0.05)"/>

  <!-- Main Content Dashboard -->
  <!-- Header Bar -->
  <text x="305" y="148" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="22">Dashboard Executive & Project Analytics</text>
  <text x="305" y="168" fill="#94a3b8" font-family="sans-serif" font-size="13">Bumi Wiraraja Group — Real-time Property & Construction Overview</text>

  <!-- Metric Cards (4 Cards Grid) -->
  <!-- Card 1 -->
  <rect x="305" y="190" width="180" height="90" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)"/>
  <text x="320" y="215" fill="#94a3b8" font-family="sans-serif" font-size="12">Total Unit Perumahan</text>
  <text x="320" y="245" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="26">248 Unit</text>
  <text x="320" y="265" fill="#22c55e" font-family="sans-serif" font-size="11">↑ 12 unit bulan ini</text>

  <!-- Card 2 -->
  <rect x="500" y="190" width="180" height="90" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)"/>
  <text x="515" y="215" fill="#94a3b8" font-family="sans-serif" font-size="12">Progres Fisik Rata-rata</text>
  <text x="515" y="245" fill="#6366f1" font-family="sans-serif" font-weight="bold" font-size="26">78.4 %</text>
  <text x="515" y="265" fill="#6366f1" font-family="sans-serif" font-size="11">Target: 80% (On Schedule)</text>

  <!-- Card 3 -->
  <rect x="695" y="190" width="180" height="90" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)"/>
  <text x="710" y="215" fill="#94a3b8" font-family="sans-serif" font-size="12">Piutang Terbayar</text>
  <text x="710" y="245" fill="#10b981" font-family="sans-serif" font-weight="bold" font-size="22">Rp 4.82M</text>
  <text x="710" y="265" fill="#10b981" font-family="sans-serif" font-size="11">94.2% Collection Rate</text>

  <!-- Card 4 -->
  <rect x="890" y="190" width="220" height="90" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)"/>
  <text x="905" y="215" fill="#94a3b8" font-family="sans-serif" font-size="12">Pekerja Active / Site</text>
  <text x="905" y="245" fill="#f59e0b" font-family="sans-serif" font-weight="bold" font-size="26">64 Orang</text>
  <text x="905" y="265" fill="#94a3b8" font-family="sans-serif" font-size="11">5 Subkontraktor Active</text>

  <!-- Big Chart & Table Mockup -->
  <rect x="305" y="300" width="570" height="295" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)"/>
  <text x="325" y="330" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="15">Kurva-S & Progress Timeline Pembangunan</text>
  <!-- Chart lines -->
  <path d="M340 550 Q 450 520, 520 440 T 700 370 T 840 350" fill="none" stroke="#6366f1" stroke-width="4"/>
  <path d="M340 550 Q 450 535, 520 470 T 700 400 T 840 380" fill="none" stroke="#a855f7" stroke-dasharray="6,6" stroke-width="2"/>

  <rect x="890" y="300" width="220" height="295" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)"/>
  <text x="905" y="330" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="14">Aktivitas Proyek</text>
  <rect x="905" y="350" width="190" height="45" rx="6" fill="rgba(255,255,255,0.04)"/>
  <rect x="905" y="405" width="190" height="45" rx="6" fill="rgba(255,255,255,0.04)"/>
  <rect x="905" y="460" width="190" height="45" rx="6" fill="rgba(255,255,255,0.04)"/>
  <rect x="905" y="515" width="190" height="45" rx="6" fill="rgba(255,255,255,0.04)"/>

  <!-- Watermark Badge -->
  <g transform="translate(970, 70)">
    <rect width="150" height="26" rx="13" fill="url(#accentGrad)"/>
    <text x="75" y="17" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle">SLIDE 1 / 6</text>
  </g>
</svg>
