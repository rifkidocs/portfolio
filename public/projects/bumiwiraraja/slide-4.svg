<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#854d0e"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.07)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <circle cx="900" cy="300" r="250" fill="#d97706" opacity="0.15" filter="blur(70px)"/>

  <!-- App Frame Header -->
  <rect x="60" y="50" width="1080" height="575" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  <rect x="60" y="50" width="1080" height="48" rx="16" fill="rgba(30, 41, 59, 0.9)"/>
  <circle cx="90" cy="74" r="6" fill="#ef4444"/>
  <circle cx="110" cy="74" r="6" fill="#eab308"/>
  <circle cx="130" cy="74" r="6" fill="#22c55e"/>
  <text x="185" y="78" fill="#94a3b8" font-family="sans-serif" font-size="12">bumiwirarajagroup.com/admin/gudang/receiving</text>

  <!-- Content -->
  <text x="305" y="148" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="22">Tagihan Hutang Supplier & Penerimaan Gudang</text>
  <text x="305" y="168" fill="#94a3b8" font-family="sans-serif" font-size="13">Verifikasi Stok Material, Filter Status Penerimaan & Rekonsiliasi Hutang Suplier</text>

  <!-- Content Grid -->
  <rect x="305" y="195" width="805" height="400" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)"/>
  <text x="325" y="230" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="15">📦 Logistik Material & Penerimaan Barang Supplier</text>
  
  <rect x="325" y="250" width="180" height="35" rx="6" fill="url(#accentGrad)"/>
  <text x="340" y="272" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="12">Filter Material: Semen & Besi</text>

  <rect x="520" y="250" width="180" height="35" rx="6" fill="rgba(255,255,255,0.05)"/>
  <text x="535" y="272" fill="#94a3b8" font-family="sans-serif" font-size="12">Status: Lunas / Hutang</text>

  <!-- Inventory Table Wireframe -->
  <rect x="325" y="300" width="765" height="270" rx="8" fill="rgba(0,0,0,0.2)"/>
  <rect x="340" y="325" width="735" height="40" rx="4" fill="rgba(255,255,255,0.05)"/>
  <text x="360" y="350" fill="#ffffff" font-family="sans-serif" font-size="12">PO-8812 — PT Semen Indonesia (500 Sak Semen Gresik) — Status: Verified & Stocked</text>

  <rect x="340" y="375" width="735" height="40" rx="4" fill="rgba(255,255,255,0.05)"/>
  <text x="360" y="400" fill="#ffffff" font-family="sans-serif" font-size="12">PO-8815 — TB Jaya Makmur (Besi Beton 12mm 200 Batang) — Status: Pending Verification</text>

  <!-- Watermark Badge -->
  <g transform="translate(970, 70)">
    <rect width="150" height="26" rx="13" fill="url(#accentGrad)"/>
    <text x="75" y="17" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle">SLIDE 4 / 6</text>
  </g>
</svg>
