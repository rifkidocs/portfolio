<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#431407"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.07)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <circle cx="850" cy="300" r="260" fill="#c2410c" opacity="0.15" filter="blur(70px)"/>

  <!-- App Frame -->
  <rect x="60" y="50" width="1080" height="575" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  
  <text x="100" y="120" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="22">Accounting & Chart of Accounts (COA) Plotting</text>
  <text x="100" y="145" fill="#94a3b8" font-family="sans-serif" font-size="13">Posting Akun COA, Jurnal Umum, Mutasi Kas/Bank & Laporan Arus Kas Proyek</text>

  <!-- COA Grid -->
  <rect x="100" y="175" width="1000" height="420" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)"/>
  <rect x="120" y="200" width="960" height="45" rx="6" fill="rgba(255,255,255,0.05)"/>
  <text x="140" y="228" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">COA 1101-01 — Bank BCA Utama Operasional (Debet: Rp 2.450.000.000)</text>
  
  <rect x="120" y="260" width="960" height="45" rx="6" fill="rgba(255,255,255,0.05)"/>
  <text x="140" y="288" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">COA 2101-05 — Hutang Usaha Supplier Bahan Bangunan (Kredit: Rp 380.000.000)</text>

  <rect x="120" y="320" width="960" height="45" rx="6" fill="rgba(255,255,255,0.05)"/>
  <text x="140" y="348" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">COA 4101-02 — Pendapatan Penjualan Unit Perumahan Blok A (Kredit: Rp 4.120.000.000)</text>
</svg>
