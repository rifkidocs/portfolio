  <rect x="305" y="195" width="520" height="400" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)"/>
  <text x="325" y="230" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="15">💳 Form Pembayaran Piutang (CurrencyInput)</text>
  
  <rect x="325" y="250" width="480" height="35" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(139, 92, 246, 0.4)"/>
  <text x="340" y="272" fill="#e2e8f0" font-family="sans-serif" font-size="12">Booking ID: BK-2026-089 (Bpk. Hendra — Perum Wiraraja Regency A-12)</text>

  <rect x="325" y="300" width="230" height="35" rx="6" fill="rgba(255,255,255,0.04)"/>
  <text x="335" y="322" fill="#94a3b8" font-family="sans-serif" font-size="11">Jumlah Bayar: Rp 25.000.000</text>

  <rect x="565" y="300" width="240" height="35" rx="6" fill="rgba(255,255,255,0.04)"/>
  <text x="575" y="322" fill="#94a3b8" font-family="sans-serif" font-size="11">Pos Keuangan: Rek. BCA Utama</text>

