  <text x="340" y="405" fill="#94a3b8" font-family="sans-serif" font-size="11">• 10/08/2026 — Angsuran Ke-3: Rp 15.000.000 (Pos: BCA Utama)</text>
  <text x="340" y="430" fill="#94a3b8" font-family="sans-serif" font-size="11">• 10/07/2026 — Angsuran Ke-2: Rp 15.000.000 (Pos: BCA Utama)</text>
  <text x="340" y="455" fill="#94a3b8" font-family="sans-serif" font-size="11">• 10/06/2026 — Uang Muka (DP): Rp 50.000.000 (Pos: Mandiri Ops)</text>

  <!-- Financial Pos Summary Widget -->
  <rect x="845" y="195" width="265" height="400" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)"/>
  <text x="865" y="230" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="14">Pos Keuangan Active</text>
