  <text x="880" y="275" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="13">BCA Operasional Utama</text>
  <text x="880" y="300" fill="#10b981" font-family="sans-serif" font-weight="bold" font-size="16">Rp 1.450.000.000</text>

  <!-- Watermark Badge -->
  <g transform="translate(970, 70)">
