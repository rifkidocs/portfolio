<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#831843"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.07)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <circle cx="850" cy="400" r="260" fill="#be185d" opacity="0.15" filter="blur(70px)"/>

  <!-- App Frame Header -->
  <rect x="60" y="50" width="1080" height="575" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  <rect x="60" y="50" width="1080" height="48" rx="16" fill="rgba(30, 41, 59, 0.9)"/>
  <circle cx="90" cy="74" r="6" fill="#ef4444"/>
  <circle cx="110" cy="74" r="6" fill="#eab308"/>
  <circle cx="130" cy="74" r="6" fill="#22c55e"/>
  <text x="185" y="78" fill="#94a3b8" font-family="sans-serif" font-size="12">bumiwirarajagroup.com/admin/marketing/units</text>

  <!-- Content -->
  <text x="305" y="148" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="22">Marketing & Matrix Status Unit Kavling</text>
  <text x="305" y="168" fill="#94a3b8" font-family="sans-serif" font-size="13">Visualisasi Unit Rumah Available, Booked, Terjual & Integrasi SPK Marketing</text>

  <!-- Unit Kavling Grid Mockup -->
  <rect x="305" y="195" width="805" height="400" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)"/>
  <text x="325" y="230" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="15">🏡 Siteplan & Grid Status Unit Perumahan</text>

  <!-- Grid of Unit Boxes -->
  <g transform="translate(325, 250)">
    <!-- Row 1 -->
    <rect x="0" y="0" width="90" height="60" rx="6" fill="#10b981"/><text x="45" y="35" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">A-01</text>
    <rect x="105" y="0" width="90" height="60" rx="6" fill="#10b981"/><text x="150" y="35" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">A-02</text>
    <rect x="210" y="0" width="90" height="60" rx="6" fill="#ef4444"/><text x="255" y="35" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">A-03 (Sold)</text>
    <rect x="315" y="0" width="90" height="60" rx="6" fill="#f59e0b"/><text x="360" y="35" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">A-04 (Booked)</text>
    <rect x="420" y="0" width="90" height="60" rx="6" fill="#10b981"/><text x="465" y="35" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">A-05</text>
    <rect x="525" y="0" width="90" height="60" rx="6" fill="#ef4444"/><text x="570" y="35" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">A-06 (Sold)</text>

    <!-- Row 2 -->
    <rect x="0" y="75" width="90" height="60" rx="6" fill="#ef4444"/><text x="45" y="110" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">B-01</text>
    <rect x="105" y="75" width="90" height="60" rx="6" fill="#f59e0b"/><text x="150" y="110" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">B-02</text>
    <rect x="210" y="75" width="90" height="60" rx="6" fill="#10b981"/><text x="255" y="110" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">B-03</text>
    <rect x="315" y="75" width="90" height="60" rx="6" fill="#10b981"/><text x="360" y="110" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">B-04</text>
    <rect x="420" y="75" width="90" height="60" rx="6" fill="#ef4444"/><text x="465" y="110" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">B-05</text>
    <rect x="525" y="75" width="90" height="60" rx="6" fill="#10b981"/><text x="570" y="110" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">B-06</text>
  </g>

  <!-- Legend -->
  <g transform="translate(325, 410)">
    <rect x="0" y="0" width="16" height="16" rx="4" fill="#10b981"/>
    <text x="25" y="13" fill="#94a3b8" font-size="12">Available (Tersedia)</text>
    <rect x="180" y="0" width="16" height="16" rx="4" fill="#f59e0b"/>
    <text x="205" y="13" fill="#94a3b8" font-size="12">Booked / DP</text>
    <rect x="330" y="0" width="16" height="16" rx="4" fill="#ef4444"/>
    <text x="355" y="13" fill="#94a3b8" font-size="12">Terjual (Akad/KPR)</text>
  </g>

  <!-- Watermark Badge -->
  <g transform="translate(970, 70)">
    <rect width="150" height="26" rx="13" fill="url(#accentGrad)"/>
    <text x="75" y="17" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle">SLIDE 6 / 6</text>
  </g>
</svg>
