  <!-- Filter Bar -->
  <rect x="305" y="190" width="805" height="50" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
  <rect x="320" y="202" width="220" height="26" rx="6" fill="rgba(255,255,255,0.08)"/>
  <text x="335" y="219" fill="#94a3b8" font-family="sans-serif" font-size="12">🔍 Cari Unit: Blok A-12 (Tipe 36)...</text>
  <rect x="555" y="202" width="160" height="26" rx="6" fill="rgba(255,255,255,0.08)"/>
