  <rect x="720" y="360" width="80" height="20" rx="10" fill="#10b981"/>
  <text x="732" y="374" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">Published</text>

  <rect x="325" y="400" width="490" height="40" rx="6" fill="rgba(255,255,255,0.04)"/>
  <text x="340" y="424" fill="#ffffff" font-family="sans-serif" font-size="12">Blok C-04 (Plester Dinding Pasangan Bata) - 40%</text>
  <rect x="720" y="410" width="80" height="20" rx="10" fill="#f59e0b"/>
  <text x="742" y="424" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">Draft</text>

  <!-- Photo Log Gallery Card -->
  <rect x="850" y="255" width="260" height="340" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)"/>
  <text x="865" y="285" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="14">Foto Dokumentasi Lapangan</text>
  <rect x="865" y="300" width="110" height="80" rx="6" fill="rgba(255,255,255,0.06)"/>
  <rect x="985" y="300" width="110" height="80" rx="6" fill="rgba(255,255,255,0.06)"/>
  <rect x="865" y="390" width="110" height="80" rx="6" fill="rgba(255,255,255,0.06)"/>
  <rect x="985" y="390" width="110" height="80" rx="6" fill="rgba(255,255,255,0.06)"/>

  <!-- Watermark Badge -->
  <g transform="translate(970, 70)">
    <rect width="150" height="26" rx="13" fill="url(#accentGrad)"/>
    <text x="75" y="17" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle">SLIDE 2 / 6</text>
