  <rect x="720" y="310" width="80" height="20" rx="10" fill="#10b981"/>
  <text x="732" y="324" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">Published</text>

  <rect x="325" y="350" width="490" height="40" rx="6" fill="rgba(255,255,255,0.04)"/>
