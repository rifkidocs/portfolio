<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.07)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <circle cx="500" cy="300" r="260" fill="#4338ca" opacity="0.15" filter="blur(70px)"/>

  <!-- App Frame -->
  <rect x="60" y="50" width="1080" height="575" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  
  <text x="100" y="120" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="22">Master Data Perumahan, Developer & Tipe Unit Kavling</text>
  <text x="100" y="145" fill="#94a3b8" font-family="sans-serif" font-size="13">Pengelolaan Lokasi Proyek, Developer Pengembang & Spesifikasi Tipe Unit Rumah</text>

  <!-- Master Data Grid -->
  <rect x="100" y="175" width="1000" height="420" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)"/>
  <rect x="120" y="200" width="960" height="45" rx="6" fill="rgba(255,255,255,0.05)"/>
  <text x="140" y="228" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Proyek #1: Perumahan Wiraraja Regency Phase 1 (Banyuwangi — 120 Unit Tipe 36 & 45)</text>
  
  <rect x="120" y="260" width="960" height="45" rx="6" fill="rgba(255,255,255,0.05)"/>
  <text x="140" y="288" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Proyek #2: Perumahan Grand Wiraraja Estate (Lamongan — 128 Unit Tipe 54 & 70 Ruko)</text>
